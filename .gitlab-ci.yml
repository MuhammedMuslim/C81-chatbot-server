variables:
  HARBOR_REGISTRY: "harbor-core.harbor:80"
  HARBOR_PROJECT: "ankabut-dxp"
  KANIKO_IMAGE: "gcr.io/kaniko-project/executor:v1.23.0-debug"
  DOCKER_CONFIG: /kaniko/.docker/
#gcr.io/kaniko-project/executor:v1.23.0
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "test"
      when: always
    - when: never

stages:
  - dockerize
  - deploy

# ─────────────────────────────────────────────
# TEMPLATE: Kaniko build + push to Harbor
# ─────────────────────────────────────────────

.docker_build:
  stage: dockerize
  tags:
    - k8s-test
  image:
    name: "$KANIKO_IMAGE"
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - |
      REGISTRY_AUTH=$(echo -n "${TEST_HARBOR_USER}:${TEST_HARBOR_PASSWORD}" | base64 | tr -d '\n')
      cat > /kaniko/.docker/config.json <<EOF
      {
        "auths": {
          "${HARBOR_REGISTRY}": {
            "auth": "${REGISTRY_AUTH}"
          }
        }
      }
      EOF
    - chmod 600 /kaniko/.docker/config.json
  #- cat /kaniko/.docker/config.json
# ─────────────────────────────────────────────
# Liferay  SERVICE
# ─────────────────────────────────────────────

docker:chatbot-server:
  extends: .docker_build
  script:
    - |
      TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
      IMAGE="$HARBOR_REGISTRY/$HARBOR_PROJECT/chatbot-server"
      /kaniko/executor \
        --context    "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/Dockerfile" \
        --destination "$IMAGE:$TAG" \
        --destination "$IMAGE:latest" \
        --insecure \
        --skip-tls-verify \
        --skip-tls-verify-pull \
        --verbosity=info






# ─────────────────────────────────────────────
# FULL BUILD — git tag أو manual
# ─────────────────────────────────────────────

docker-all:chatbot-server:
  extends: .docker_build
  script:
    - |
      TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
      IMAGE="$HARBOR_REGISTRY/$HARBOR_PROJECT/chatbot-server"
      /kaniko/executor \
        --context    "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/Dockerfile" \
        --destination "$IMAGE:$TAG" \
        --destination "$IMAGE:latest" \
        --insecure \
        --skip-tls-verify \
        --verbosity=info
  rules:
    - if: '$CI_COMMIT_TAG'
    - when: manual
      allow_failure: true

.deploy_template:
  stage: deploy
  image: bitnami/kubectl:latest
  tags:
    - k8s-test
  before_script:
    - kubectl version --client

deploy:chatbot-server:
  variables:
    KUBE_NAMESPACE: backend
  extends: .deploy_template
  needs:
    - job: docker:chatbot-server
      optional: true
  script:
    - kubectl rollout restart deployment/chatbot-server -n $KUBE_NAMESPACE